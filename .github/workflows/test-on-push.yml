name: Run Tests
on:
  push:
    branches:
      # '**' and not '*': a single star stops at a slash, so every branch
      # named the way this project names them - fix/..., feat/... - was
      # never tested until it landed on master, which is where the last two
      # merges turned red.
      - '**'
  # Pull requests from forks: their branches never reach this repository, so
  # the push trigger above does not see them. Branches of this repository are
  # already tested on push; the job conditions below skip their PR runs.
  pull_request:
  workflow_dispatch:
jobs:
  run-tests-linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        ruby: [ '3.3', '3.4', '4.0' ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Bumped to drop caches saved while a Ruby 3.3 bundle was committed
          # under vendor/bundle: its binstubs call `ruby3.3`, which the
          # runners do not have, and every cache hit restored them.
          cache-version: 1
          apt-get: "xz-utils gcc xpra xserver-xorg-video-dummy libxrandr-dev libfox-1.6-dev swig"

      - name: Start xpra to enable GLX
        run: |
          mkdir -p ${HOME}/.xpra
          xpra --xvfb="Xorg +extension GLX -config `pwd`/test/dummy.xorg.conf -logfile ${HOME}/.xpra/xorg.log" start :9
          echo "DISPLAY=:9" >> $GITHUB_ENV

      - name: Build stub and run tests
        env:
          OCRAN_DEBUG: "0"
        run: |
          bundle exec rake build
          bundle exec rake test

      - name: Fail if the test run left the working tree dirty
        shell: bash
        run: bash .github/check-clean-tree.sh

      - name: Build zlib fixture for cross-distro test
        env:
          OCRAN_DEBUG: "0"
        run: ruby -Ilib exe/ocran test/fixtures/zlib/zlib.rb --output /tmp/zlib_packed

      - name: Run packed executable on Debian (no Ruby installed)
        run: docker run --rm -e OCRAN_DEBUG=0 -v /tmp:/mnt debian:stable-slim /mnt/zlib_packed

  run-tests-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
        ruby: ['3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Bumped to drop caches saved while a Ruby 3.3 bundle was committed
          # under vendor/bundle: its binstubs call `ruby3.3`, which the
          # runners do not have, and every cache hit restored them.
          cache-version: 1
          brew: "xz fox swig"

      - name: Install and start XQuartz
        run: |
          brew install --cask xquartz
          open -a XQuartz

      - name: Build stub and run tests
        run: |
          bundle exec rake build
          bundle exec rake test

      - name: Fail if the test run left the working tree dirty
        shell: bash
        run: bash .github/check-clean-tree.sh

      - name: Build zlib fixture for cross-system test
        run: ruby -Ilib exe/ocran test/fixtures/zlib/zlib.rb --output zlib_packed

      - name: Upload packed binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zlib-macos-${{ matrix.os }}-${{ matrix.ruby }}
          path: zlib_packed
          retention-days: 1

  test-macos-portability:
    needs: run-tests-macos
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15-intel ]
        ruby: [ '3.3', '3.4', '4.0' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install XQuartz
        run: |
          brew install --cask xquartz
          open -a XQuartz

      - name: Download packed binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zlib-macos-${{ matrix.os }}-${{ matrix.ruby }}

      - name: Run packed executable
        run: |
          chmod +x zlib_packed
          ./zlib_packed

  # --spinel against the real compiler: Spinel is built from source (a few
  # minutes, cached by its revision) and the end-to-end test compiles the
  # fixture and runs the binary. The other jobs skip that test because the
  # runners have no Spinel.
  test-spinel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 1

      - name: Check out Spinel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: matz/spinel
          path: spinel-src

      - name: Spinel revision
        id: spinel
        run: echo "sha=$(git -C spinel-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the Spinel build
        id: cache-spinel
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local
          key: spinel-${{ runner.os }}-${{ steps.spinel.outputs.sha }}

      - name: Build and install Spinel
        if: steps.cache-spinel.outputs.cache-hit != 'true'
        run: |
          cd spinel-src
          make deps
          make -j"$(nproc)"
          make install PREFIX="$HOME/.local"

      - name: Run the native compilation tests
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          spinel --version
          bundle exec ruby -Ilib:test test/test_native_compilation.rb --verbose

  # --wasm against the real runtimes: ruby.wasm and PicoRuby from npm, rbwasm
  # from the ruby_wasm gem, and the exports run under Node. The other jobs
  # skip those tests because they have no ruby_wasm.
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
          cache-version: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Cache the runtimes from npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ocran/npm
          key: ocran-npm-${{ hashFiles('lib/ocran/wasm_builder.rb') }}

      - name: Install ruby_wasm
        run: gem install ruby_wasm --no-document

      - name: Run the WebAssembly export tests
        run: bundle exec ruby -Ilib:test test/test_wasm_export.rb --verbose

  test-source-gem-install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xz-utils gcc make

      - name: Build and install source gem
        run: |
          gem build ocran-source.gemspec
          gem install --local ocran-*.gem

      - name: Build zlib executable and run portability test (Linux)
        if: runner.os == 'Linux'
        run: |
          ocran test/fixtures/zlib/zlib.rb --output /tmp/zlib_from_source_gem
          docker run --rm -v /tmp:/mnt debian:stable-slim /mnt/zlib_from_source_gem

      - name: Build and run zlib executable (Windows)
        if: runner.os == 'Windows'
        run: |
          ocran test/fixtures/zlib/zlib.rb --no-lzma --output zlib_from_source_gem.exe
          .\zlib_from_source_gem.exe

  run-tests-windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        ruby: [ '3.3', '3.4', '4.0' ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Cache Inno Setup
        id: cache-innosetup
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: innosetup-6.7.1

      - name: Install Inno Setup
        if: steps.cache-innosetup.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          INNOSETUP_VERSION: "6.7.1"
          INNOSETUP_SHA256: "4D11E8050B6185E0D49BD9E8CC661A7A59F44959A621D31D11033124C4E8A7B0"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest `
            -UseBasicParsing `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNOSETUP_VERSION -replace '\.','_')/innosetup-$($env:INNOSETUP_VERSION).exe" `
            -OutFile innosetup.exe
          $actual = (Get-FileHash innosetup.exe -Algorithm SHA256).Hash
          if ($actual -ne $env:INNOSETUP_SHA256) {
            Write-Error "Hash mismatch: expected $($env:INNOSETUP_SHA256), got $actual"
            exit 1
          }
          Write-Host "SHA256 OK"
          .\innosetup.exe /verysilent /allusers /suppressmsgboxes /norestart

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # Bumped to drop caches saved while a Ruby 3.3 bundle was committed
          # under vendor/bundle: its binstubs call `ruby3.3`, which the
          # runners do not have, and every cache hit restored them.
          cache-version: 1
          mingw: "fox swig"

      - name: Install bundle
        run: bundle install

      # - name: Install Tcl/Tk MSYS2 packages
      #   shell: pwsh
      #   run: ridk exec pacman -S --noconfirm mingw-w64-ucrt-x86_64-tcl mingw-w64-ucrt-x86_64-tk

      - name: Build stub and run tests
        run: |
          bundle exec rake build
          bundle exec rake test

      - name: Fail if the test run left the working tree dirty
        shell: bash
        run: bash .github/check-clean-tree.sh

      - name: Build zlib fixture for portability test
        run: bundle exec ruby -Ilib exe/ocran test/fixtures/zlib/zlib.rb --output zlib_packed.exe

      - name: Upload packed binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zlib-windows-${{ matrix.ruby }}
          path: zlib_packed.exe
          retention-days: 1

  test-windows-portability:
    needs: run-tests-windows
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest ]
        ruby: [ '3.3', '3.4', '4.0' ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download packed binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: zlib-windows-${{ matrix.ruby }}

      - name: Run packed executable
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\system32;C:\Windows"
          .\zlib_packed.exe
