name: Build and Release Gem

on:
  push:
    tags:
      - '*'
  # A dry run: builds and tests everything a release would contain and
  # lists it, but publishes nothing.
  workflow_dispatch:

jobs:
  # Any tag triggers this workflow, so make sure it names the version that
  # is being released before anything is built or published.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that the tag matches Ocran::VERSION
        if: github.event_name == 'push'
        run: |
          version=$(ruby -e 'load "lib/ocran/version.rb"; print Ocran::VERSION')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Ocran::VERSION ($version)"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # x64-mingw-ucrt
          - os: ubuntu-latest    # x86_64-linux
          - os: macos-14     # arm64-darwin  (Apple Silicon)
          - os: macos-15-intel         # x86_64-darwin (Intel)

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby-pkgs@2233d39c1315c667a2970436418b520a6300124e # v1.33.5
        with:
          ruby-version: '4.0'
          bundler-cache: true
          mingw: "fox swig"
          apt-get: "xz-utils gcc xpra xserver-xorg-video-dummy libxrandr-dev libfox-1.6-dev swig"
          brew: "xz fox swig"

      - name: Start xpra to enable GLX
        if: runner.os == 'Linux'
        run: |
          mkdir -p ${HOME}/.xpra
          xpra --xvfb="Xorg +extension GLX -config `pwd`/test/dummy.xorg.conf -logfile ${HOME}/.xpra/xorg.log" start :9
          echo "DISPLAY=:9" >> $GITHUB_ENV

      - name: Install and start XQuartz
        if: runner.os == 'macOS'
        run: |
          brew install --cask xquartz
          open -a XQuartz

      - name: Build stubs and run tests
        run: |
          bundle exec rake build
          bundle exec rake test

      - name: Build platform gem
        run: gem build ocran.gemspec

      - name: Upload gem artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-${{ matrix.os }}
          path: '*.gem'

  build-source-gem:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'
          # No bundler-cache: gem build reads only the gemspec, and installing
          # the Gemfile would compile fxruby, which needs libfox-1.6-dev.

      - name: Build source gem
        run: gem build ocran-source.gemspec

      - name: Upload gem artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-source
          path: '*.gem'

  # The static runtimes for --static-runtime, built, tested and attested by
  # their own workflows, go into the release with the gems: a published
  # release is immutable, so they cannot be added afterwards.
  runtime-windows:
    needs: check-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/static-runtime-windows.yml

  runtime-linux:
    needs: check-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/static-runtime-linux.yml

  runtime-macos:
    needs: check-version
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/static-runtime-macos.yml

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, build-source-gem, runtime-windows, runtime-linux, runtime-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all gem artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gem-*
          merge-multiple: true

      - name: Download the runtimes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ocran-runtime-*
          path: runtimes
          merge-multiple: true

      - name: What a release would contain
        run: sha256sum *.gem runtimes/*

  release:
    if: github.event_name == 'push'
    needs: [build, build-source-gem, runtime-windows, runtime-linux, runtime-macos]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write   # OIDC token for RubyGems trusted publishing and Sigstore
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all gem artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gem-*
          merge-multiple: true

      # Attested by the runtime workflows already.
      - name: Download the runtimes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ocran-runtime-*
          path: runtimes
          merge-multiple: true

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      # Signed build provenance for every gem, before it is published: the
      # same files go to the GitHub release and to rubygems.org, so a gem
      # from either can be checked with
      # gh attestation verify ocran-<version>-<platform>.gem -R Largo/ocran
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '*.gem'

      # rubygems.org shows a gem as built and signed on GitHub Actions only
      # when it is pushed with a Sigstore bundle for it (the attestation
      # above stays on GitHub). Every gem is signed with this workflow's
      # identity before anything is published (the GitHub release is
      # immutable), so that a failed signature stops the release; RubyGems
      # 4.0 does not sign by itself (this is what rubygems/release-gem does).
      - name: Sign gems for RubyGems.org provenance
        run: |
          for gem in *.gem; do
            gem exec sigstore-cli:0.2.3 sign "$gem" --bundle "$gem.sigstore.json"
          done

      - name: Extract changelog for this version
        # Written to a file and passed via --notes-file: interpolating the
        # notes into the shell command breaks as soon as the changelog
        # contains quotes or apostrophes.
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk "/^=== $VERSION/{found=1; next} found && /^===/{exit} found{print}" CHANGELOG.txt > /tmp/release-notes.txt
          {
            echo
            echo "## Static runtimes (--static-runtime)"
            echo
            echo "Built from this tag, tested and attested by CI. Unpack one and pass its directory to \`ocran app.rb --static-runtime <dir>\`; verify a download with \`gh attestation verify <file> -R ${{ github.repository }}\`. See runtime/README.md."
            echo
            for f in runtimes/*; do echo "- \`$(basename "$f")\`"; done
          } >> /tmp/release-notes.txt

      - name: Create GitHub Release and upload gems
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.txt \
            *.gem runtimes/*

      # Trusted publishing: exchanges the workflow's OIDC token for a
      # short-lived RubyGems API key, so no long-lived secret is needed.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push gems to RubyGems
        run: |
          for gem in *.gem; do
            gem push "$gem" --attestation "$gem.sigstore.json"
          done
