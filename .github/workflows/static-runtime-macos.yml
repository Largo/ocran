name: Static runtime (macOS)

# Builds the macOS static Ruby runtime from the pinned sources
# (runtime/macos/build-runtime.sh), packages the smoke-test applications
# with it - nokogiri included, built against the runtime's SDK - and runs
# them.

on:
  # Branch pushes only: for a release tag, gem-release.yml calls this
  # workflow and attaches the runtime to the release.
  push:
    branches: ['**']
    paths:
      - 'runtime/**'
      - 'lib/ocran/static_runtime/**'
      - 'lib/ocran/static_runtime_builder.rb'
      - 'lib/ocran/runtime_sdk.rb'
      - '.github/workflows/static-runtime-macos.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # baseruby: the same minor version as the runtime.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      - name: Cache source tarballs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rt/src
          key: static-runtime-sources-${{ hashFiles('runtime/sources.lock') }}

      - name: Build the runtime
        run: runtime/macos/build-runtime.sh "$RUNNER_TEMP/rt" 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Inspect the runtime
        run: |
          rt="$RUNNER_TEMP/rt/out"
          ls -la "$rt" "$rt/sdk"
          cat "$rt/runtime.json"
          otool -L "$rt/ocran-runtime"
          # Only system libraries may be linked dynamically.
          if otool -L "$rt/ocran-runtime" | tail -n +2 | grep -v -E '^\s+/(usr/lib|System/Library)/'; then
            echo "non-system library linked" >&2; exit 1
          fi
          codesign -dv "$rt/ocran-runtime"
          codesign --verify --strict "$rt/ocran-runtime"

      - name: Install nokogiri for the build host
        run: gem install nokogiri --no-document

      - name: Smoke tests
        env:
          OCRAN_SMOKE_NETWORK: '1'
          OCRAN_SMOKE_GEMS: '1'
        run: ruby runtime/smoke/run.rb "$RUNNER_TEMP/rt/out" "$RUNNER_TEMP/smoke"

      # The same application, packaged again (another temporary directory,
      # a later time), must give the same bytes.
      - name: Packaging is reproducible
        run: |
          ruby runtime/smoke/run.rb "$RUNNER_TEMP/rt/out" "$RUNNER_TEMP/smoke-again"
          cmp "$RUNNER_TEMP"/smoke/smoke-app "$RUNNER_TEMP"/smoke-again/smoke-app
          echo "smoke-app: identical"

      - name: Check the packaged executables
        run: |
          for exe in "$RUNNER_TEMP"/smoke/smoke-app "$RUNNER_TEMP"/smoke/smoke-https "$RUNNER_TEMP"/smoke/smoke-gems; do
            codesign --verify --strict "$exe"
            # libxml2 and libxslt are the runtime's, not those of macOS.
            if otool -L "$exe" | grep -E 'libxml2|libxslt|libexslt'; then
              echo "$exe links a system libxml2/libxslt" >&2; exit 1
            fi
            size "$exe" -m | grep -A2 __OCRAN
            # The archive is a plain ZIP: extract the section and list it.
            segedit "$exe" -extract __OCRAN __zip "$exe.zip"
            unzip -l "$exe.zip" | tail -3
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-runtime-macos-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/rt/work/gemext.log
            ${{ runner.temp }}/rt/work/gemext/**/mkmf.log
            ${{ runner.temp }}/rt/work/ruby-build/config.log
            ${{ runner.temp }}/smoke/*.build.log
          if-no-files-found: ignore

      # Only a runtime that passed the tests above is packed and attested.
      # The tarball is reproducible (runtime/pack-runtime.rb); verify a
      # download with: gh attestation verify <file> -R Largo/ocran
      - name: Pack the runtime
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          ruby runtime/pack-runtime.rb "$RUNNER_TEMP/rt/out" "$RUNNER_TEMP/dist"
          echo "tarball=$(ls "$RUNNER_TEMP"/dist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/rt/out/ocran-runtime

      - name: Upload the runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocran-runtime-macos-arm64
          path: ${{ steps.pack.outputs.tarball }}
          compression-level: 0 # already gzip
