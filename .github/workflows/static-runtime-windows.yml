name: Static runtime (Windows)

# Builds the Windows (x64, MinGW UCRT) static Ruby runtime from the pinned
# sources (runtime/build-runtime.sh, a cross build on Linux), tests it on
# Windows - executables packaged on Linux and on Windows itself, nokogiri
# included - and attests the runtime once the tests pass.

on:
  push:
    paths:
      - 'runtime/**'
      - 'lib/ocran/static_runtime/**'
      - 'lib/ocran/static_runtime_builder.rb'
      - 'lib/ocran/runtime_sdk.rb'
      - 'lib/ocran/pe_resources.rb'
      - '.github/workflows/static-runtime-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the MinGW cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-ucrt64 g++-mingw-w64-ucrt64

      # baseruby: the same version as the runtime (a cross build).
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      - name: Cache source tarballs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/rt/src
          key: static-runtime-windows-sources-${{ hashFiles('runtime/sources.lock') }}

      - name: Build the runtime
        run: runtime/build-runtime.sh "$RUNNER_TEMP/rt" 2>&1 | tee "$RUNNER_TEMP/build.log"; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Install nokogiri for the build host
        run: gem install nokogiri --no-document

      # Packaged here, run on Windows below.
      - name: Package the smoke tests on Linux
        env:
          OCRAN_SMOKE_NETWORK: '1'
          OCRAN_SMOKE_GEMS: '1'
        run: ruby runtime/smoke/run.rb "$RUNNER_TEMP/rt/out" "$RUNNER_TEMP/smoke"

      - name: Pack the runtime
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          ruby runtime/pack-runtime.rb "$RUNNER_TEMP/rt/out" "$RUNNER_TEMP/dist"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-runtime-windows-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/rt/work/gemext.log
            ${{ runner.temp }}/rt/work/gemext/**/mkmf.log
            ${{ runner.temp }}/rt/work/ruby-build/config.log
            ${{ runner.temp }}/smoke/*.build.log
          if-no-files-found: ignore

      - name: Upload the runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocran-runtime-windows-x64
          path: ${{ runner.temp }}/dist/*.tar.gz
          compression-level: 0 # already gzip

      - name: Upload the executables packaged on Linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-windows-packaged-on-linux
          path: ${{ runner.temp }}/smoke/*.exe

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Also puts MSYS2's gcc on PATH, for building gem extensions here.
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '4.0'

      - name: Download the runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ocran-runtime-windows-x64
          path: ${{ runner.temp }}/dist

      - name: Download the executables packaged on Linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smoke-windows-packaged-on-linux
          path: ${{ runner.temp }}/smoke-linux

      - name: Extract the runtime
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\rt" | Out-Null
          $tarball = (Get-ChildItem "$env:RUNNER_TEMP\dist\*.tar.gz").FullName
          & "$env:SystemRoot\System32\tar.exe" -xzf $tarball -C "$env:RUNNER_TEMP\rt"
          $dir = (Get-ChildItem -Directory "$env:RUNNER_TEMP\rt").FullName
          "RUNTIME_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          Get-Content "$dir\runtime.json"

      - name: Check DLL imports
        run: ruby -I lib runtime/smoke/check-pe-imports.rb "$env:RUNTIME_DIR\ocran-runtime.exe" (Get-ChildItem "$env:RUNNER_TEMP\smoke-linux\*.exe").FullName

      - name: Run the executables packaged on Linux
        env:
          OCRAN_SMOKE_PREBUILT: '1'
          OCRAN_SMOKE_NETWORK: '1'
          OCRAN_SMOKE_GEMS: '1'
        run: ruby runtime/smoke/run.rb "$env:RUNTIME_DIR" "$env:RUNNER_TEMP\smoke-linux"

      - name: Install nokogiri for the build host
        run: gem install nokogiri --no-document

      # Packaging on Windows, gem extensions built with MSYS2's gcc.
      - name: Package and run the smoke tests on Windows
        env:
          OCRAN_SMOKE_NETWORK: '1'
          OCRAN_SMOKE_GEMS: '1'
          OCRAN_RUNTIME_CC: gcc
        run: ruby runtime/smoke/run.rb "$env:RUNTIME_DIR" "$env:RUNNER_TEMP\smoke-windows"

      - name: Check DLL imports of the executables packaged on Windows
        run: ruby -I lib runtime/smoke/check-pe-imports.rb (Get-ChildItem "$env:RUNNER_TEMP\smoke-windows\*.exe").FullName

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-runtime-windows-test-logs
          path: ${{ runner.temp }}/smoke-windows/*.build.log
          if-no-files-found: ignore

  # Only a runtime that passed the tests is attested. The tarball is
  # reproducible (runtime/pack-runtime.rb); verify a download with:
  # gh attestation verify <file> -R Largo/ocran
  attest:
    needs: [build, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
    steps:
      - name: Download the runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ocran-runtime-windows-x64
          path: dist

      - name: Extract the runtime executable
        run: tar -xzf dist/*.tar.gz --wildcards '*/ocran-runtime.exe' --strip-components=1

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            ocran-runtime.exe
